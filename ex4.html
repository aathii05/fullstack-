<!DOCTYPE html>
<html ng-app="todoApp">
<head>
    <title>Enhanced To-Do List</title>

    <!-- AngularJS CDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
            background: #f4f4f4;
        }

        .container {
            background: white;
            width: 350px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        input[type="text"] {
            padding: 8px;
            width: 65%;
        }

        button {
            padding: 8px;
            margin-left: 5px;
            cursor: pointer;
        }

        li {
            list-style: none;
            margin: 10px 0;
            text-align: left;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        .footer {
            margin-top: 15px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>

<body ng-controller="todoController">

<div class="container">
    <h2>📝 My To-Do List</h2>

    <!-- Input box -->
    <input type="text" 
           ng-model="newTask" 
           placeholder="Enter a task"
           ng-keypress="($event.which === 13) && addTask()">

    <!-- Add button -->
    <button ng-click="addTask()">Add</button>

    <ul>
        <li ng-repeat="task in tasks track by $index">

            <input type="checkbox" ng-model="task.completed" ng-change="saveTasks()">

            <span ng-class="{'completed': task.completed}">
                {{task.name}}
            </span>

            <button ng-click="deleteTask($index)">❌</button>
        </li>
    </ul>

    <div class="footer">
        Total Tasks: {{tasks.length}}
    </div>

    <button ng-click="clearCompleted()">Clear Completed</button>
</div>

<script>
    var app = angular.module("todoApp", []);

    app.controller("todoController", function($scope) {

        // Load tasks from localStorage
        $scope.tasks = JSON.parse(localStorage.getItem("tasks")) || [];

        $scope.saveTasks = function() {
            localStorage.setItem("tasks", JSON.stringify($scope.tasks));
        };

        $scope.addTask = function() {
            if ($scope.newTask && $scope.newTask.trim() !== "") {
                $scope.tasks.push({
                    name: $scope.newTask.trim(),
                    completed: false
                });
                $scope.newTask = "";
                $scope.saveTasks();
            }
        };

        $scope.deleteTask = function(index) {
            $scope.tasks.splice(index, 1);
            $scope.saveTasks();
        };

        $scope.clearCompleted = function() {
            $scope.tasks = $scope.tasks.filter(function(task) {
                return !task.completed;
            });
            $scope.saveTasks();
        };

    });
</script>

</body>
</html>
